# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - readingcornerdep

on:
  push:
    branches:
      - rony
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://readingcornerreg.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_9ee84fca4f704522943c6263bbeeac60 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_76196e794ce44255afdf8b546289297b }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: readingcornerreg.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_9ee84fca4f704522943c6263bbeeac60 }}/readingcorner-backend:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'readingcornerdep'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_434f41be8575496dbf7524ebfb8f5c30 }}
        images: 'readingcornerreg.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_9ee84fca4f704522943c6263bbeeac60 }}/readingcorner-backend:${{ github.sha }}'